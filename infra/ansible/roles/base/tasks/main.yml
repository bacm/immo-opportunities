---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Install base administration packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - rsync
      - unattended-upgrades
      - ufw
      - fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set server timezone
  community.general.timezone:
    name: Europe/Paris

- name: Disable password authentication over SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-immo-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
  notify: Restart ssh

- name: Enable fail2ban protection for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/immo-sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = {{ ansible_port | default(22) }}
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Enable fail2ban service
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Refuse bootstrap without an SSH allowlist
  ansible.builtin.assert:
    that:
      - immo_admin_cidrs | length > 0
    fail_msg: immo_admin_cidrs must contain at least one administrative CIDR before UFW is enabled.

- name: Allow SSH from administrative networks
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | default(22) | string }}"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ immo_admin_cidrs }}"

- name: Allow public TCP services through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Allow HTTP/3 through UFW
  community.general.ufw:
    rule: allow
    port: "443"
    proto: udp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Install automatic security updates configuration
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52immo-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Install kernel tuning for the container host
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-immo.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      vm.swappiness=1
      vm.overcommit_memory=1
      net.core.somaxconn=4096
  notify: Reload sysctl
