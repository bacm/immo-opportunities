---
- name: Ensure encrypted secrets file exists on controller
  ansible.builtin.stat:
    path: "{{ immo_sops_file }}"
  delegate_to: localhost
  become: false
  register: immo_sops_stat

- name: Refuse deployment without encrypted secrets
  ansible.builtin.assert:
    that:
      - immo_sops_stat.stat.exists
    fail_msg: "Missing encrypted secrets file: {{ immo_sops_file }}"

- name: Decrypt secrets in controller memory
  ansible.builtin.set_fact:
    immo_decrypted_secrets: "{{ lookup('community.sops.sops', immo_sops_file) | from_yaml }}"
  no_log: true

- name: Create target secrets directory
  ansible.builtin.file:
    path: "{{ immo_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install runtime secret files
  ansible.builtin.copy:
    dest: "{{ immo_secrets_dir }}/{{ item.key }}"
    content: "{{ item.value }}\n"
    owner: root
    group: root
    mode: "0400"
  loop: "{{ immo_decrypted_secrets | dict2items }}"
  no_log: true

