---
- name: Validate and mount each data volume
  ansible.builtin.include_tasks: volume.yml
  loop: "{{ immo_data_volumes }}"
  loop_control:
    loop_var: immo_volume

- name: Create runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ immo_runtime_directories }}"

- name: Create data directories not backed by separate volumes
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ immo_data_directories }}"
