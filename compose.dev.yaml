services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    networks:
      dev:

  minio:
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"

  keycloak:
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18081}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_HOST_PORT:-19002}:9000"

  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"

  martin:
    ports:
      - "127.0.0.1:${MARTIN_HOST_PORT:-13000}:3000"

  dagster-webserver:
    ports:
      - "127.0.0.1:${DAGSTER_HOST_PORT:-13001}:3000"

  caddy:
    ports:
      - "127.0.0.1:${CADDY_HOST_PORT:-8080}:8080"

  grafana:
    networks:
      dev:

networks:
  dev:
