groups:
  - name: brittany-pilot
    rules:
      - alert: PlatformBackupMissingOrStale
        expr: absent(immo_backup_last_success_timestamp_seconds) or (time() - immo_backup_last_success_timestamp_seconds > 93600)
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: La sauvegarde complète a plus de 26 heures ou sa métrique est absente.
      - alert: ImportPipelineStale
        expr: absent(immo_import_last_success_timestamp_seconds) or (time() - immo_import_last_success_timestamp_seconds > 172800)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: Aucun import réussi depuis 48 heures.
      - alert: CriticalSourcePublicationMissing
        expr: count(immo_source_last_publication_timestamp_seconds) < 9
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: Une ou plusieurs sources DS-01 à DS-09 n'ont aucune release active.
      - alert: ObservedServiceDown
        expr: up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Une cible Prometheus est indisponible.
      # G7 : les seuls événements qui appellent une action pendant le pilote.
      - alert: ImportFailedNotRecovered
        expr: immo_source_last_import_failure_timestamp_seconds > immo_source_last_import_success_timestamp_seconds
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Import {{ $labels.dataset }} en échec sur {{ $labels.territory_type }} {{ $labels.territory }}, sans réussite depuis. Motif : meta.import_run.error_message."
      - alert: UpstreamUnhealthy
        expr: caddy_reverse_proxy_upstreams_healthy == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.upstream }} échoue au contrôle de santé de Caddy (API : /health/ready, Martin : /health)."
      # Paramètre déclaré, pas une cible produit : le p95 sur 10 min dépasse trois fois celui des
      # 24 dernières heures. SPEC.md ne fixe aucune cible de latence.
      - alert: ApiLatencyDegraded
        expr: >
          histogram_quantile(0.95, sum by (le) (rate(immo_api_request_duration_milliseconds_bucket[10m])))
          > 3 * histogram_quantile(0.95, sum by (le) (rate(immo_api_request_duration_milliseconds_bucket[24h])))
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: Le p95 de l'API sur 10 minutes dépasse trois fois son p95 des 24 dernières heures.
