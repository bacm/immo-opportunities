[tool.uv.workspace]
members = ["backend", "pipelines"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src", "pipelines/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["backend/src", "pipelines/src"]
exclude = ["**/__pycache__"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests", "pipelines/tests"]
