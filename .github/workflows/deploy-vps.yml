name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment and Ansible inventory to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]
      bootstrap:
        description: Prepare a clean Ubuntu VPS before deploying
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.environment || 'production' }}-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 30
    env:
      ENV: ${{ inputs.environment || 'production' }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      ADMIN_CIDRS_JSON: ${{ vars.ADMIN_CIDRS_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate required deployment settings
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: ./scripts/check-vps-deployment-settings

      - name: Install ephemeral deployment credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          install -m 0700 -d "$RUNNER_TEMP/immo-credentials"
          install -m 0600 /dev/null "$RUNNER_TEMP/immo-credentials/id_ed25519"
          install -m 0600 /dev/null "$RUNNER_TEMP/immo-credentials/known_hosts"
          install -m 0600 /dev/null "$RUNNER_TEMP/immo-credentials/age-keys.txt"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/immo-credentials/id_ed25519"
          printf '%s\n' "$VPS_SSH_HOST_KEY" > "$RUNNER_TEMP/immo-credentials/known_hosts"
          printf '%s\n' "$SOPS_AGE_KEY" > "$RUNNER_TEMP/immo-credentials/age-keys.txt"

      - name: Render Ansible inventory
        run: make inventory ENV=production

      - name: Validate infrastructure
        run: make validate ENV=production

      - name: Bootstrap and deploy clean VPS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        env:
          AGE_KEY_FILE: ${{ runner.temp }}/immo-credentials/age-keys.txt
          SSH_PRIVATE_KEY_FILE: ${{ runner.temp }}/immo-credentials/id_ed25519
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/immo-credentials/known_hosts
        run: make bootstrap ENV=production

      - name: Deploy application
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.bootstrap) }}
        env:
          AGE_KEY_FILE: ${{ runner.temp }}/immo-credentials/age-keys.txt
          SSH_PRIVATE_KEY_FILE: ${{ runner.temp }}/immo-credentials/id_ed25519
          SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/immo-credentials/known_hosts
        run: make deploy ENV=production

      - name: Verify public HTTPS endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "https://${APP_DOMAIN}/health" | grep -qx ok

      - name: Remove ephemeral deployment credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/immo-credentials"
