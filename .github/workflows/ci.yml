name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Les invariants de diff comparent la branche a sa base : un clone superficiel
          # n'a pas le commit de base.
          fetch-depth: 0

      - name: Install Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.6"
          enable-cache: true

      - name: Sync Python workspace
        run: uv sync --all-packages --all-groups --locked

      - name: Check Python
        run: make python-check

      - name: Verify OpenAPI contract
        run: make openapi-check

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: make web-check

      - name: Validate Compose
        run: make config

      # `make check` verifie les lignes ajoutees du travail en cours : sur un arbre propre,
      # il n'a rien a lire. C'est ici que le controle porte reellement, sur le diff de la
      # branche.
      - name: Check diff invariants
        if: github.event_name == 'pull_request'
        run: ./scripts/check-diff-invariants --base ${{ github.event.pull_request.base.sha }}
