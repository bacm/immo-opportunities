services:
  prometheus-init:
    image: ${BUSYBOX_IMAGE:-busybox:1.37.0}
    init: true
    restart: "no"
    user: "0:0"
    command: ["sh", "-ec", "chown -R 65532:65532 /prometheus"]
    volumes:
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0}
    init: true
    restart: unless-stopped
    user: "65532:65532"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/prometheus", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus-init:
        condition: service_completed_successfully

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.2}
    init: true
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 5s
      retries: 5

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    init: true
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    networks:
      - observability
      - edge
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.18.0}
    init: true
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - observability
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/bin/alloy", "fmt", "--test", "/etc/alloy/config.alloy"]
      interval: 30s
      timeout: 10s
      retries: 5

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.10.2}
    init: true
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --no-collector.hwmon
    volumes:
      - /:/host:ro,rslave
      - ${RUNTIME_DATA_PATH:-./.runtime}/metrics:/var/lib/node_exporter/textfile_collector:ro
    pid: host
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:
